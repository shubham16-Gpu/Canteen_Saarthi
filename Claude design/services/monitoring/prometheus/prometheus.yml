# ============================================================================
# Canteen Management - Prometheus Configuration
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (uncomment when ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files (uncomment when rule files are added)
# rule_files:
#   - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Canteen API metrics
  - job_name: "canteen-api"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: "api"
          environment: "production"

  # Canteen Worker metrics
  - job_name: "canteen-worker"
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["worker:4001"]
        labels:
          service: "worker"
          environment: "production"

  # PostgreSQL exporter (if deployed)
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Redis exporter (if deployed)
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Node exporter for host metrics (if deployed)
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
