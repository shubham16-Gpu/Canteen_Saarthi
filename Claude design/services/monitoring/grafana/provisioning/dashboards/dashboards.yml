# ============================================================================
# Canteen Management - Grafana Dashboard Provisioning
# ============================================================================

apiVersion: 1

providers:
  - name: "Canteen Dashboards"
    orgId: 1
    folder: "Canteen Management"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
